<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>成果物のストア</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="社内のツールと素材を公開・入手できるストアです。オフィシャル（審査済み）とインディーズ（審査なし）の2つの区分があります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --bg-side:#F2F2F7; --surface:#FFFFFF; --tile:#F2F2F7;
  --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.20); --fill-half:rgba(120,120,128,.06);
  --sep:rgba(60,60,67,.29); --label:rgba(0,0,0,.9); --label-2:#6E6E73;
  --accent:#007AFF; --on-accent:#FFFFFF; --focus:rgba(0,122,255,.35);
  --bar:rgba(255,255,255,.8); --band:rgba(255,255,255,.92);
  --shadow:0 8px 20px rgba(0,0,0,.12); --shadow-hover:0 12px 28px rgba(0,0,0,.16); --ring:none;
  --shadow-float:0 24px 60px rgba(0,0,0,.28); --shadow-toast:0 8px 24px rgba(0,0,0,.18); --shadow-paper:0 8px 20px rgba(0,0,0,.12); --shadow-art:0 12px 28px rgba(0,0,0,.28); --shadow-knob:0 2px 6px rgba(0,0,0,.2);
  --seg-thumb:#FFFFFF; --seg-shadow:0 1px 3px rgba(0,0,0,.12);
  --paper-s:55%; --paper-l:93%; --paper-ink-s:60%; --paper-ink-l:30%; --board-l:94%; --board-s:55%;
  --t-large:34px; --lh-large:40px; --t-1:28px; --lh-1:34px; --t-2:22px; --lh-2:28px;
  --t-head:17px; --lh-head:22px; --t-body:15px; --lh-body:24px; --t-sub:13px; --lh-sub:18px; --t-cap:11px; --lh-cap:13px;
  --r-card:16px; --r-img:12px; --r-box:10px; --r-chip:8px;
  --gutter:24px; --side:220px; --tab-h:49px; --tab-total:calc(var(--tab-h) + env(safe-area-inset-bottom, 0px));
  --font:"Inter","Noto Sans JP","Segoe UI Variable Text","Segoe UI","Yu Gothic UI",system-ui,sans-serif;
  --dur:120ms; --dur-2:200ms;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1C1E; --bg-side:#131315; --surface:#2C2C2E; --tile:#2C2C2E;
    --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.34); --fill-half:rgba(120,120,128,.12);
    --sep:rgba(84,84,88,.65); --label:#FFFFFF; --label-2:rgba(235,235,245,.6);
    --accent:#0A84FF; --focus:rgba(10,132,255,.45); --bar:rgba(28,28,30,.8); --band:rgba(44,44,46,.92);
    --shadow:none; --shadow-hover:none; --ring:1px solid rgba(255,255,255,.08);
    --shadow-float:none; --shadow-toast:none; --shadow-paper:none; --shadow-art:0 12px 28px rgba(0,0,0,.28); --shadow-knob:none;
    --seg-thumb:#636366; --seg-shadow:none;
    --paper-s:30%; --paper-l:24%; --paper-ink-s:70%; --paper-ink-l:75%; --board-l:22%; --board-s:30%;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1C1C1E; --bg-side:#131315; --surface:#2C2C2E; --tile:#2C2C2E;
  --fill:rgba(120,120,128,.24); --fill-2:rgba(120,120,128,.34); --fill-half:rgba(120,120,128,.12);
  --sep:rgba(84,84,88,.65); --label:#FFFFFF; --label-2:rgba(235,235,245,.6);
  --accent:#0A84FF; --focus:rgba(10,132,255,.45); --bar:rgba(28,28,30,.8); --band:rgba(44,44,46,.92);
  --shadow:none; --shadow-hover:none; --ring:1px solid rgba(255,255,255,.08);
  --shadow-float:none; --shadow-toast:none; --shadow-paper:none; --shadow-art:0 12px 28px rgba(0,0,0,.28); --shadow-knob:none;
  --seg-thumb:#636366; --seg-shadow:none;
  --paper-s:30%; --paper-l:24%; --paper-ink-s:70%; --paper-ink-l:75%; --board-l:22%; --board-s:30%;
}
@media (max-width:1023px){ :root{ --gutter:20px; } }
@media (max-width:599px){ :root{ --gutter:16px; --t-large:28px; --lh-large:34px; } }

/* ---------- base ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--label); font-family:var(--font); font-size:var(--t-body); line-height:var(--lh-body); font-weight:400; font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
a{ color:var(--accent); text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; }
input,select,textarea{ font:inherit; color:inherit; }
h1,h2,h3,p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
[hidden]{ display:none !important; }
svg{ display:block; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.ell{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.ui{ width:16px; height:16px; flex:0 0 auto; }
.cap{ font-size:var(--t-cap); line-height:var(--lh-cap); font-weight:700; letter-spacing:.06em; color:var(--label-2); }
.sub{ font-size:var(--t-sub); line-height:var(--lh-sub); color:var(--label-2); }
.t2{ font-size:var(--t-2); line-height:var(--lh-2); font-weight:700; }
.t1{ font-size:var(--t-1); line-height:var(--lh-1); font-weight:700; }
.muted{ color:var(--label-2); }
.ck{ display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
.ck svg{ width:12px; height:12px; }
.only-narrow{ display:none; }
/* 押せる物の当たり判定を 44 に広げる（見た目は変えない） */
.pill,.chip,.bc a,.sec-h .more,.dhead .links a,.toggle,.dhead .maker,.desc-more{ position:relative; }
.pill::before,.chip::before,.bc a::before,.sec-h .more::before,.dhead .links a::before,.toggle::before,.dhead .maker::before,.seg button::before,.desc-more::before{ content:""; position:absolute; left:0; right:0; top:50%; height:44px; transform:translateY(-50%); }

/* ---------- app frame ---------- */
.app{ display:grid; grid-template-columns:var(--side) 1fr; min-height:100vh; }
.side{ position:sticky; top:0; height:100vh; background:var(--bg-side); border-right:1px solid var(--sep); display:flex; flex-direction:column; padding:16px 12px 12px; }
.side .sq{ position:relative; margin:0 0 16px; }
.sq input{ width:100%; height:36px; border:0; border-radius:var(--r-box); background:var(--fill); padding:0 12px 0 34px; color:var(--label); }
.sq input::placeholder{ color:var(--label-2); }
.sq > svg{ position:absolute; left:11px; top:10px; width:16px; height:16px; color:var(--label-2); pointer-events:none; }
.sq input:focus-visible,.qbox input:focus-visible,.rvbar input:focus-visible,.refpick input:focus-visible{ outline:0; box-shadow:0 0 0 4px var(--focus); }
.sq-list{ position:absolute; left:0; width:320px; top:40px; background:var(--surface); border:1px solid var(--sep); border-radius:var(--r-box); box-shadow:var(--shadow); z-index:30; overflow:hidden; }
.sq-list button{ display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; align-items:center; width:100%; height:44px; padding:0 10px; text-align:left; }
.sq-list button:hover,.sq-list button.on{ background:var(--fill-half); }
.sq-list .row-mid{ display:block; min-width:0; }
.sq-list .ell{ display:block; font-size:var(--t-body); line-height:20px; }
.sq-list .sub{ display:block; line-height:16px; }
.side .grp{ margin:0 0 20px; }
.side .grp .cap{ display:block; padding:0 8px 6px; }
.nav{ display:flex; align-items:center; gap:10px; height:32px; padding:0 8px; border-radius:var(--r-chip); color:var(--label); width:100%; text-align:left; }
.nav svg{ width:18px; height:18px; color:var(--accent); flex:0 0 auto; }
.nav:hover{ background:var(--fill-half); }
.nav.on{ background:var(--accent); color:var(--on-accent); }
.nav.on svg{ color:var(--on-accent); }
.nav .n{ margin-left:auto; color:var(--label-2); font-size:var(--t-sub); }
.nav.on .n{ color:rgba(255,255,255,.8); }
.me{ margin-top:auto; display:flex; align-items:center; gap:10px; padding:8px; border-radius:var(--r-chip); width:100%; text-align:left; }
.me:hover{ background:var(--fill-half); }
.avatar{ width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:var(--t-sub); font-weight:700; flex:0 0 auto; }
.me .ell{ font-size:var(--t-sub); line-height:var(--lh-sub); }
.me .sub{ display:block; }
.main{ min-width:0; }
.wrap{ max-width:1200px; margin:0 auto; padding:0 var(--gutter) 64px; }
.wrap.narrow{ max-width:none; margin:0; }
.wrap.narrow > *{ max-width:932px; }
.wrap.narrow > .bleed{ max-width:none; }

/* sticky compact bar */
.bar{ position:sticky; top:0; z-index:20; height:52px; margin-bottom:-52px; pointer-events:none; }
.bar-in{ height:52px; display:flex; align-items:center; gap:12px; max-width:1200px; margin:0 auto; padding:0 var(--gutter); opacity:0; transform:translateY(6px); transition:opacity var(--dur),transform var(--dur); }
.bar.is-compact{ pointer-events:auto; background:var(--bar); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-bottom:1px solid var(--sep); }
.bar.is-compact .bar-in{ opacity:1; transform:none; transition-duration:var(--dur-2); }
.bar-in .ttl{ font-size:var(--t-head); line-height:var(--lh-head); font-weight:700; }
.bar-in .icon{ width:32px; height:32px; }
.bar-in .row-act{ margin-left:auto; }

/* page head */
.page{ opacity:1; transition:opacity 160ms; }
.page.out{ opacity:0; }
.ph{ padding-top:24px; }
.ph .eyebrow{ display:block; margin-bottom:2px; }
.ph .large{ font-size:var(--t-large); line-height:var(--lh-large); font-weight:700; display:flex; align-items:flex-end; gap:12px; }
.ph .large .n{ font-size:var(--t-head); line-height:var(--lh-head); font-weight:400; color:var(--label-2); padding-bottom:6px; white-space:nowrap; }
.ph .large .pill{ margin-left:auto; align-self:center; display:none; }
.ph .sub{ margin-top:4px; }
.ph .sub button{ color:var(--accent); }
.sentinel{ height:1px; }
.ph.has-bc{ padding-top:16px; }
.bc{ font-size:var(--t-sub); line-height:var(--lh-sub); margin-bottom:12px; display:flex; gap:6px; flex-wrap:wrap; }
.bc .sep{ color:var(--label-2); }
.bc .cur{ color:var(--label-2); }
@media (max-width:599px){ .ph .large{ flex-wrap:wrap; row-gap:4px; } .ph .large > span:first-child{ flex:1 0 auto; min-width:0; } .ph .large .pill{ flex:0 0 auto; margin-left:auto; } }

/* sections */
.sec{ margin-top:48px; }
.sec-h{ display:flex; align-items:flex-end; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.sec-h .t2{ white-space:nowrap; }
.sec-h .sub{ margin-bottom:2px; }
.sec-h .more{ margin-left:auto; font-size:var(--t-body); white-space:nowrap; }
.sec-h .arrows{ display:none; gap:8px; margin-left:auto; }
.sec-h .more + .arrows{ margin-left:8px; }
.sec-h .arrows button{ width:28px; height:28px; border-radius:50%; background:var(--fill); color:var(--label); display:grid; place-items:center; }
.sec-h .arrows button:hover{ background:var(--fill-2); }
.sec-h .arrows svg{ width:14px; height:14px; }
.sec-h .arrows button:disabled{ opacity:.35; cursor:default; }
@media (min-width:1024px){ .sec-h .arrows{ display:flex; } }
@media (max-width:599px){ .sec-h .sub{ flex-basis:100%; order:5; margin-top:-8px; } }
.foot{ margin-top:64px; padding-top:16px; border-top:1px solid var(--sep); font-size:var(--t-sub); line-height:var(--lh-sub); color:var(--label-2); display:flex; gap:16px; flex-wrap:wrap; }

/* ---------- icon ---------- */
.icon{ border-radius:22%; overflow:hidden; flex:0 0 auto; width:64px; height:64px; background:var(--fill); }
.icon.material .face{ fill:hsl(var(--h) var(--paper-s) var(--paper-l)); }
.icon.material .frame{ fill:none; stroke:hsl(var(--h) var(--paper-ink-s) var(--paper-ink-l)); stroke-opacity:.25; stroke-width:1; }
.icon.material use{ stroke:hsl(var(--h) var(--paper-ink-s) var(--paper-ink-l)); }
.icon.tool use{ stroke:#fff; }
.icon.ph{ background:var(--fill); }
.icon-120{ width:120px; height:120px; }
.icon-96{ width:96px; height:96px; }
.icon-44{ width:44px; height:44px; }
.icon-32{ width:32px; height:32px; }
.icon-28{ width:28px; height:28px; }
.shelf-ic{ width:28px; height:28px; border-radius:22%; display:grid; place-items:center; flex:0 0 auto; background:linear-gradient(135deg,hsl(var(--h) 72% var(--l)),hsl(calc(var(--h) + 18) 70% calc(var(--l) - 10%))); }
.shelf-ic svg{ width:18px; height:18px; stroke:#fff; }

/* ---------- row card (A) ---------- */
.row{ position:relative; display:grid; grid-template-columns:64px minmax(0,1fr) auto; gap:16px; align-items:center; height:80px; padding:8px 16px; border-radius:var(--r-box); transition:background var(--dur),transform var(--dur); }
.row:hover{ background:var(--fill-half); }
.row:active{ transform:scale(.99); }
.row-mid{ min-width:0; }
.row-name{ display:flex; align-items:center; gap:8px; font-size:var(--t-head); line-height:var(--lh-head); }
.row-name a{ color:var(--label); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.row-name a::after{ content:""; position:absolute; inset:0; border-radius:var(--r-box); }
.row-name .ck{ flex:0 0 auto; }
.row-tag{ font-size:var(--t-sub); line-height:var(--lh-sub); color:var(--label-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-meta{ display:flex; gap:12px; font-size:var(--t-sub); line-height:var(--lh-sub); color:var(--label-2); }
.row-meta .ell{ flex:1 1 auto; }
.row-meta .why{ flex:0 0 auto; margin-left:auto; white-space:nowrap; }
.row-act{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:2px; }
.rows .row + .row::before{ content:""; position:absolute; left:96px; right:16px; top:-1px; height:1px; background:var(--sep); }
.rows .row:hover::before{ opacity:0; }
.rows .row{ margin:0 -16px; }
.rows .row-meta{ gap:0; }
.rows .row-meta .ell{ flex:0 1 auto; }
.rows .row-meta .why{ margin-left:0; }
.rows .row-meta .ell:not(:empty) + .why::before{ content:" · "; white-space:pre; }
.row.small{ height:64px; grid-template-columns:44px minmax(0,1fr); padding:8px 12px; }
.row.small .icon{ width:44px; height:44px; }
.row.small .row-name{ font-size:var(--t-body); line-height:20px; }
.row .sub{ color:var(--label-2); }
@media (max-width:599px){ .row{ gap:12px; } .row-meta .why{ display:none; } .row-name .ck .t{ display:none; } .shelf{ grid-auto-columns:calc(100% - 16px); } }

/* pill */
.pill{ height:28px; min-width:72px; padding:0 14px; border-radius:999px; background:var(--fill); color:var(--accent); font-size:var(--t-body); font-weight:700; line-height:28px; text-align:center; white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; transition:background var(--dur),transform var(--dur); }
.pill:hover{ background:var(--fill-2); }
.pill:active{ transform:scale(.97); }
.pill.state{ color:var(--label-2); color:color-mix(in srgb, var(--label) 72%, var(--fill)); pointer-events:none; }
.pill.primary{ background:var(--accent); color:var(--on-accent); height:40px; min-width:120px; padding:0 20px; line-height:40px; }
.pill.primary:hover{ filter:brightness(1.06); background:var(--accent); }
.pill.primary.state{ background:var(--fill); color:var(--label-2); color:color-mix(in srgb, var(--label) 72%, var(--fill)); }
.pill.big{ height:44px; line-height:44px; width:100%; }
.pill.mid{ height:32px; line-height:32px; padding:0 16px; }
.pill:disabled{ opacity:.45; cursor:default; }
@media (max-width:599px){ .pill{ min-width:64px; padding:0 12px; } }
.ring{ width:28px; height:28px; }
.ring circle{ fill:none; stroke-width:2; }
.ring .bg{ stroke:var(--sep); }
.ring .fg{ stroke:var(--accent); stroke-dasharray:75.4; stroke-dashoffset:75.4; transform:rotate(-90deg); transform-origin:center; animation:ring 900ms linear forwards; }
@keyframes ring{ to{ stroke-dashoffset:0; } }

/* shelf: 3 rows x N columns, horizontal scroll */
.shelf{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(3,80px); grid-auto-columns:calc(100% - 24px); column-gap:20px; overflow-x:auto; overscroll-behavior-x:contain; scroll-snap-type:x mandatory; scrollbar-width:none; margin:0 calc(-1 * var(--gutter)); padding:0 var(--gutter); scroll-padding:0 var(--gutter); }
.shelf::-webkit-scrollbar{ display:none; }
.shelf .row{ scroll-snap-align:start; padding:8px 0; }
.shelf .row:hover{ background:var(--fill-half); box-shadow:0 0 0 8px var(--fill-half); border-radius:4px; }
.shelf .row:not(:nth-child(3n+1))::before{ content:""; position:absolute; left:80px; right:0; top:-1px; height:1px; background:var(--sep); }
.shelf .row:hover::before{ opacity:0; }
.shelf.short{ grid-template-rows:repeat(2,80px); }
.shelf.one{ grid-template-rows:80px; }
/* 本文の幅が 900 以上のときだけ 2 列（<1024 はサイドバー無し、≥1024 はサイドバー 220） */
@media (min-width:940px) and (max-width:1023px), (min-width:1168px){ .shelf{ grid-auto-columns:calc((100% - 20px - 24px) / 2); } }
@media (max-width:599px){ .shelf .row:not(:nth-child(3n+1))::before{ left:76px; } }

/* ---------- Today card (B) ---------- */
.today{ position:relative; display:block; height:400px; border-radius:var(--r-card); overflow:hidden; box-shadow:var(--shadow); border:var(--ring); color:#fff; transition:transform var(--dur-2),box-shadow var(--dur-2); }
.today:hover{ transform:scale(1.015); box-shadow:var(--shadow-hover); }
.today .scrim{ position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 60%); }
.today .mark{ position:absolute; right:-70px; top:-50px; width:440px; height:440px; opacity:.10; pointer-events:none; }
.today .mark svg{ width:100%; height:100%; stroke:#fff; }
.today .txt{ position:absolute; left:20px; top:20px; right:20px; max-width:560px; word-break:auto-phrase; }
.today .txt .cap{ color:rgba(255,255,255,.7); display:block; margin-bottom:6px; }
.today .txt .t1{ color:#fff; }
.today .txt .lead{ font-size:var(--t-head); line-height:var(--lh-head); color:rgba(255,255,255,.85); margin-top:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.today .stack{ position:absolute; right:48px; top:calc(50% - 36px); transform:translateY(-50%); display:flex; }
.today .stack .icon{ width:140px; height:140px; box-shadow:var(--shadow-art); margin-left:-40px; }
.today .stack .icon:first-child{ margin-left:0; }
.today .stack .icon:nth-child(1){ transform:rotate(-8deg) translateY(10px); }
.today .stack .icon:nth-child(3){ transform:rotate(8deg) translateY(10px); }
.today .band{ position:absolute; left:0; right:0; bottom:0; height:72px; background:var(--band); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); color:var(--label); display:flex; align-items:center; gap:12px; padding:0 20px; }
.today .band .row-name{ font-size:var(--t-body); }
.today .band .more{ margin-left:auto; color:var(--accent); font-size:var(--t-body); white-space:nowrap; }
@media (max-width:899px){ .today .stack .icon{ width:110px; height:110px; margin-left:-32px; } .today .stack{ right:32px; } }
@media (min-width:600px) and (max-width:1263px){ .today .stack{ top:auto; bottom:112px; transform:none; } }
@media (max-width:599px){ .today{ height:auto; aspect-ratio:4 / 5; } .today .stack{ right:20px; top:auto; bottom:100px; transform:none; } .today .stack .icon{ width:88px; height:88px; margin-left:-28px; } .today .txt{ left:20px; top:20px; right:20px; } .today .mark{ width:300px; height:300px; right:-50px; top:-40px; } }

/* entrance tiles (E) */
.tiles2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
.tile{ display:flex; align-items:center; gap:16px; height:96px; padding:0 20px; background:var(--tile); border:var(--ring); border-radius:var(--r-card); color:var(--label); transition:transform var(--dur-2),box-shadow var(--dur-2); }
.tile:hover{ transform:scale(1.015); box-shadow:var(--shadow-hover); }
.tile .tile-ic{ width:28px; height:28px; color:var(--accent); flex:0 0 auto; }
.tile > span{ min-width:0; }
.tile .t2{ display:block; }
.tile .sub{ display:block; margin-top:2px; word-break:auto-phrase; }
.tile .n{ margin-left:auto; color:var(--label-2); white-space:nowrap; font-size:var(--t-body); }
@media (max-width:599px){ .tiles2{ grid-template-columns:1fr; } }

/* shelf tiles (F) */

  else if (key === 'review') { if (ROLE !== 'reviewer') { html = largeHead({ title:'審査待ち' }) + empty('この画面は審査担当者だけが開けます', '「公開した成果物」の「審査担当者として表示」から、「審査担当者として表示」をオンにしてください。') + footer; } else { html = pageReview(q); fixbar = true; } }
  else if (key === 'mine') html = pageMineRows();
  else html = notFound('このリンクは開けません', 'ホームからもう一度探してください。');

function render(force){
  let h = location.hash; if (!h || h === '#' || h === '#/') { h = '#/' + (ss.get('store.route') || 'home'); }
  if (h === current && !force) return;
  const back = h in scrollPos, y = window.scrollY, sl = Array.from(document.querySelectorAll('.shelf')).map(s => s.scrollLeft);
  current = h;
  const { seg, q, route } = parse(h); ss.set('store.route', route);
  let out;
  try { out = buildPage(seg, q); } catch (e) { out = { key:'home', html:notFound('このリンクは開けません', 'カテゴリーからもう一度探してください。'), fixbar:false }; }
  document.body.classList.toggle('has-fixbar', out.fixbar);
  const wrapped = /^<(article|div) class="wrap/.test(out.html) ? out.html : '<div class="wrap">' + out.html + '</div>';
  const page = document.getElementById('page');
  page.classList.add('out');
  const paint = () => {
    page.innerHTML = wrapped; page.classList.remove('out'); renderSide(out.key); observe(); afterRender(seg, q);
    if (force) { window.scrollTo(0, y); document.querySelectorAll('.shelf').forEach((s, i) => { s.scrollLeft = sl[i] || 0; }); }
    else if (back) { window.scrollTo(0, scrollPos[h] || 0); delete scrollPos[h]; }
    else window.scrollTo(0, 0);
  };

}
/* compact bar */
let io = null;
function observe(){
  if (io) io.disconnect();
  const bar = document.getElementById('bar'), sent = document.querySelector('.sentinel'); bar.classList.remove('is-compact'); if (!sent) return;
  const it = sent.dataset.item ? byId(sent.dataset.item) : null;
  document.getElementById('bar-in').innerHTML = (it ? iconSvg(it, 32) : '') + '<span class="ttl ell">' + esc(sent.dataset.title) + '</span>' + (it ? '<span class="row-act">' + pillFor(it, false, { noUnit:true }) + '</span>' : '');
  io = new IntersectionObserver(es => { es.forEach(e => bar.classList.toggle('is-compact', !e.isIntersecting && e.boundingClientRect.top < 60)); }, { rootMargin:'-52px 0px 0px 0px', threshold:0 });
  io.observe(sent);
}
function afterRender(seg, q){
  const d = document.getElementById('desc'); if (d) { const m = document.querySelector('[data-more=desc]'); if (d.scrollHeight > d.clientHeight + 2) m.hidden = false; }
  const qi = document.getElementById('q'); if (qi && seg[0] === 'search' && matchMedia('(min-width:1024px)').matches) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
  const rvn = document.getElementById('rv-note'); if (rvn) rvn.addEventListener('input', () => { document.getElementById('rv-return').disabled = !rvn.value.trim(); });
  // 横スクロールの行の ‹ ›: 送る先が無ければ隠し、端では押せなくする
  document.querySelectorAll('.sec').forEach(sec => { const sh = sec.querySelector('.shelf'), ar = sec.querySelector('.arrows'); if (!sh || !ar) return; const upd = () => { ar.hidden = sh.scrollWidth <= sh.clientWidth + 1; ar.querySelector('[data-nav=prev]').disabled = sh.scrollLeft <= 0; ar.querySelector('[data-nav=next]').disabled = sh.scrollLeft + sh.clientWidth >= sh.scrollWidth - 1; }; sh.addEventListener('scroll', upd, { passive:true }); upd(); });
}
/* ===================== interactions ===================== */
function toast(msg){ const t = document.getElementById('toast'); t.innerHTML = ui('check') + '<span class="ell">' + esc(msg) + '</span>'; t.hidden = false; clearTimeout(toast.tm); toast.tm = setTimeout(() => { t.hidden = true; }, 2400); }
let opener = null;
function sheet(html){ const s = document.getElementById('sheet'); opener = document.activeElement; s.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>'; s.hidden = false; const f = s.querySelector('button,input'); if (f) f.focus(); }
function closeSheet(){ const s = document.getElementById('sheet'); if (s.hidden) return; s.hidden = true; if (opener && opener.focus && document.contains(opener)) opener.focus(); opener = null; }
function refreshPills(id){ const it = byId(id); document.querySelectorAll('.row-act').forEach(a => { const b = a.querySelector('[data-get="' + id + '"]'); if (b) a.innerHTML = pillFor(it, b.classList.contains('primary'), { noUnit:a.closest('.fixbar,.bar-in') != null }); }); }
function acquire(id, btn){
  const it = byId(id); if (!it) return;
  if (GOT.has(id)) { if (isTool(it)) toast('「' + it.name + '」を開きます'); return; }
  if (it.price.type === 'paid' && APPLIED.has(id)) { toast('申し込み中です（提供部署の承認待ち）'); return; }
  if (it.price.type === 'paid' && it.maker.name === ME.name) { toast('自分が公開した成果物には申し込めません'); return; }
  if (it.price.type === 'paid') {
    sheet('<h2 class="t2">利用の申し込み</h2><p>' + esc(it.name) + ' — ' + yen(it.price.amount) + '（' + esc(it.price.unit) + '）</p><div class="kv"><div><span>作成者</span><span>' + esc(it.maker.name + ' · ' + it.maker.org) + '</span></div><div><span>提供部署</span><span>' + esc(deptLabel(it.price.revenue_dept)) + '</span></div><div><span>申込者</span><span>' + esc(ME.name + ' · ' + ME.org) + '</span></div><div><label for="ap-dept">費用の計上部署</label><span class="unitsel"><select id="ap-dept">' + deptOptions(APPLY_DEPT[id] || ME.dept) + '</select></span></div></div><p class="note">提供部署が承認すると、選んだ部署の費用として自動で付け替えます（月末締め・翌月度計上）。経理の手続きは不要です。</p><div class="acts"><button type="button" class="pill" data-sheet-close>キャンセル</button><button type="button" class="pill primary" data-apply="' + id + '">申し込む</button></div>');
    return;
  }
  const finish = () => { GOT.add(id); store.set('got', Array.from(GOT)); toast('「' + it.name + '」を入手しました'); refreshPills(id); };
  const w = btn.offsetWidth; btn.style.width = w + 'px'; btn.disabled = true; btn.innerHTML = '<svg class="ring" viewBox="0 0 28 28"><circle class="bg" cx="14" cy="14" r="12"/><circle class="fg" cx="14" cy="14" r="12"/></svg>';
  setTimeout(finish, reduced() ? 0 : 900);
}
function linkSheet(url){ sheet('<h2 class="t2">このページのリンク</h2><p><code>' + esc(url) + '</code></p><div class="acts"><button type="button" class="pill primary" data-sheet-close>閉じる</button></div>'); }
function copyLink(id){ const url = location.href.split('#')[0] + '#/item/' + id; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(() => toast('リンクをコピーしました'), () => linkSheet(url)); else linkSheet(url); }
function cantInstall(id){ const it = byId(id), files = it.files || []; sheet('<h2 class="t2">入手できない場合</h2><p>' + (files.length ? '同じファイルをストアの共有フォルダにも保管しています。それでも入手できない場合は、作成者に直接お問い合わせください。' : 'この成果物のファイルは、まだストアに登録されていません。作成者に直接お問い合わせください。') + '</p><div class="kv">' + (files.length ? '<div><span>共有フォルダ</span><span><code>\\\\share\\store\\' + esc(it.tier) + '\\' + esc(it.id) + '\\</code></span></div>' : '') + '<div><span>ファイル</span><span>' + esc(files.join('、') || '未登録') + '</span></div><div><span>作成者</span><span>' + esc(it.maker.name + ' · ' + it.maker.org) + '</span></div></div><div class="acts"><button type="button" class="pill primary" data-sheet-close>閉じる</button></div>'); }
function accountSheet(){ sheet('<h2 class="t2">' + esc(ME.name) + '</h2><p>' + esc(ME.org) + '</p><div class="trow" style="padding:16px 0 0"><span class="t"><span>審査担当者として表示</span><span class="hint sub">「審査待ち」の画面を開けるようになります。</span></span><button type="button" class="toggle' + (ROLE === 'reviewer' ? ' on' : '') + '" role="switch" aria-checked="' + (ROLE === 'reviewer') + '" aria-label="審査担当者として表示" data-role-toggle></button></div><div class="acts"><button type="button" class="pill primary" data-sheet-close>閉じる</button></div>'); }
function setQuery(kv){ const { route, q } = parse(location.hash || '#/' + (ss.get('store.route') || 'home')); const [k, v] = kv.split('='); const nq = Object.assign({}, q); if (v === '' || v == null) delete nq[k]; else nq[k] = v; if (k !== 'n') delete nq.n; const base = route.split('?')[0]; const qs = new URLSearchParams(nq).toString(); go(base + (qs ? '?' + qs : '')); }
function candidates(qv, box, onPick){
  const list = searchIndex(qv).slice(0, 8);
  if (qv.trim().length < 2 || !list.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.innerHTML = list.map(it => '<button type="button" data-pick="' + it.id + '">' + iconSvg(it, 28) + '<span class="row-mid"><span class="ell">' + esc(it.name) + '</span><span class="sub ell">' + esc((SHELF[it.shelf] || {}).name + ' · ' + it.maker.name) + '</span></span></button>').join('');
  box.hidden = false; box.onclick = e => { const b = e.target.closest('[data-pick]'); if (b) { onPick(b.dataset.pick); box.hidden = true; } };
}
function moveCandidate(box, dir){ const bs = Array.from(box.querySelectorAll('[data-pick]')); if (!bs.length) return; let i = bs.findIndex(b => b.classList.contains('on')); bs.forEach(b => b.classList.remove('on')); i = (i + dir + bs.length) % bs.length; bs[i].classList.add('on'); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-get],[data-nav],[data-set],[data-more],[data-copy],[data-cant],[data-sheet-close],[data-apply],[data-account],[data-role-toggle],[data-pubshelf],[data-pubenv],[data-pubref-rm],[data-pubreview],[data-approve],[data-return],[data-request]');
  if (!t) { if (e.target.id === 'sheet') closeSheet(); return; }
  if (t.dataset.go != null) { e.preventDefault(); go(t.dataset.go); return; }
  if (t.dataset.get) { e.preventDefault(); acquire(t.dataset.get, t); return; }
  if (t.dataset.nav) { const sh = t.closest('.sec').querySelector('.shelf'); const w = sh.clientWidth - 24; sh.scrollBy({ left:t.dataset.nav === 'next' ? w : -w, behavior:reduced() ? 'auto' : 'smooth' }); return; }
  if (t.dataset.set != null) { if (t.dataset.set.startsWith('pubprice=')) { PUB.price = t.dataset.set.split('=')[1]; rerenderPublish(); return; } setQuery(t.dataset.set); return; }
  if (t.dataset.more) { const d = document.getElementById(t.dataset.more); d.classList.remove('clamp'); t.hidden = true; return; }
  if (t.dataset.copy) { e.preventDefault(); copyLink(t.dataset.copy); return; }
  if (t.dataset.cant) { e.preventDefault(); cantInstall(t.dataset.cant); return; }
  if (t.dataset.sheetClose != null) { closeSheet(); return; }
  if (t.dataset.apply) { const it = byId(t.dataset.apply); const dsel = document.getElementById('ap-dept'); APPLY_DEPT[it.id] = dsel ? dsel.value : ME.dept; store.set('applyDept', APPLY_DEPT); closeSheet(); APPLIED.add(it.id); store.set('applied', Array.from(APPLIED)); toast('「' + it.name + '」の利用を申し込みました'); refreshPills(it.id); document.querySelectorAll('.fixbar .unit').forEach(u => { u.textContent = '提供部署の承認待ち'; }); return; }
  if (t.dataset.account != null) { accountSheet(); return; }
  if (t.dataset.roleToggle != null) { ROLE = ROLE === 'reviewer' ? null : 'reviewer'; store.set('role', ROLE); t.classList.toggle('on', ROLE === 'reviewer'); t.setAttribute('aria-checked', ROLE === 'reviewer'); renderSide(parse(current).seg[0] || 'home'); if (/^#\/(mine|review)/.test(current)) { const y = window.scrollY; const out = buildPage(parse(current).seg, parse(current).q); document.getElementById('page').innerHTML = /^<(article|div) class="wrap/.test(out.html) ? out.html : '<div class="wrap">' + out.html + '</div>'; observe(); afterRender(parse(current).seg, parse(current).q); window.scrollTo(0, y); } return; }
  if (t.dataset.pubshelf) { PUB.shelf = t.dataset.pubshelf; document.querySelectorAll('[data-pubshelf]').forEach(b => { b.classList.toggle('on', b.dataset.pubshelf === PUB.shelf); b.setAttribute('aria-pressed', b.dataset.pubshelf === PUB.shelf); }); refreshPreview(); return; }
  if (t.dataset.pubenv) { const v = t.dataset.pubenv; const i = PUB.envs.indexOf(v); if (i >= 0) PUB.envs.splice(i, 1); else PUB.envs.push(v); t.classList.toggle('on', i < 0); refreshPreview(); return; }
  if (t.dataset.pubrefRm) { PUB.refs = PUB.refs.filter(r => r !== t.dataset.pubrefRm); rerenderPublish(); return; }
  if (t.dataset.pubreview != null) { PUB.review = !PUB.review; t.classList.toggle('on', PUB.review); t.setAttribute('aria-checked', PUB.review); document.getElementById('p-submit').textContent = PUB.review ? '公開して審査を申請する' : 'インディーズに公開する'; refreshPreview(); return; }
  if (t.dataset.approve) { decide(t.dataset.approve, 'approved'); return; }
  if (t.dataset.return) { decide(t.dataset.return, 'returned'); return; }
  if (t.dataset.request) { const it = byId(t.dataset.request); it.review = { status:'requested', at:isoToday(), note:'' }; REVIEWS[it.id] = { review:it.review, tier:it.tier }; store.set('reviews', REVIEWS); persistPublished(); toast('審査を申請しました'); render(true); return; }
});
document.addEventListener('keydown', e => {
  const sh = document.getElementById('sheet');
  if (e.key === 'Escape') { closeSheet(); const l = document.getElementById('sq-list'); if (l) l.hidden = true; const r = document.getElementById('p-ref-list'); if (r) r.hidden = true; return; }
  if (e.key === 'Tab' && !sh.hidden) { const fs = Array.from(sh.querySelectorAll('button,input,select,textarea,[href]')).filter(x => !x.disabled); if (!fs.length) return; const first = fs[0], last = fs[fs.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } return; }
  if (e.target.id === 'sq') {
    const l = document.getElementById('sq-list');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (l && !l.hidden) { e.preventDefault(); moveCandidate(l, e.key === 'ArrowDown' ? 1 : -1); } return; }
    if (e.key === 'Enter') { e.preventDefault(); const on = l && !l.hidden ? l.querySelector('[data-pick].on') : null; if (l) l.hidden = true; if (on) go('item/' + on.dataset.pick); else go('search?q=' + encodeURIComponent(e.target.value)); return; }
  }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.pubenvNew != null) { e.preventDefault(); const v = e.target.value.trim(); if (v && !PUB.envs.includes(v)) { PUB.envs.push(v); rerenderPublish(); } return; }
  if (e.key === 'Enter' && e.target.id === 'p-ref') { e.preventDefault(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'sq') { candidates(el.value, document.getElementById('sq-list'), id => go('item/' + id)); return; }
  if (el.id === 'q') { const v = el.value; const cur = parse(location.hash).q; const t = cur.tier ? '&tier=' + encodeURIComponent(cur.tier) : ''; replaceRoute('search' + (v ? '?q=' + encodeURIComponent(v) + t : '')); document.getElementById('qres').innerHTML = searchResults(v, { tier:cur.tier }); afterRender(['search'], {}); return; }
  if (el.id === 'p-ref') { candidates(el.value, document.getElementById('p-ref-list'), id => { if (!PUB.refs.includes(id)) PUB.refs.push(id); el.value = ''; rerenderPublish(); }); return; }
  if (el.dataset.pub) { PUB[el.dataset.pub] = el.value; refreshPreview(); const c = el.parentElement.querySelector('.cnt'); if (c) c.textContent = el.value.length + '/' + el.maxLength; return; }
  if (el.dataset.pubfile != null) { PUB.files = Array.from(el.files).map(f => f.name); el.parentElement.querySelector('.fl').textContent = PUB.files.join('、'); refreshPreview(); return; }
});
document.addEventListener('change', e => { const el = e.target; if ('sort' in el.dataset) setQuery('sort=' + el.value); if (el.dataset.pub === 'unit') { PUB.unit = el.value; refreshPreview(); } if (el.dataset.pub === 'rdept') PUB.rdept = el.value; });
document.addEventListener('submit', e => {
  if (e.target.id !== 'pubform') return; e.preventDefault();
  const m = pubMissing(), box = document.getElementById('p-missing');
  if (m.length) { box.hidden = false; box.textContent = '未入力の項目: ' + m.join('、'); const tgt = { '名前':'#p-name', 'カテゴリー':'[data-pubshelf]', '金額':'#p-amount', '収入の計上部署':'#p-rdept' }[m[0]]; const el = tgt && document.querySelector(tgt); if (el) { el.scrollIntoView({ block:'center', behavior:reduced() ? 'auto' : 'smooth' }); el.focus({ preventScroll:true }); } else box.scrollIntoView({ block:'center', behavior:reduced() ? 'auto' : 'smooth' }); return; }
  const it = pubPreviewItem(); it.id = 'u-' + Date.now().toString(36); it.name = PUB.name.trim(); it.tagline = PUB.tagline.trim(); it.summary = PUB.summary.trim(); it.description = PUB.description.trim(); it.version = '1.0'; it.features = [];
  it.review = PUB.review ? { status:'requested', at:isoToday(), note:'' } : { status:'none' };
  ITEMS.push(it); persistPublished();
  Object.assign(PUB, { name:'', tagline:'', summary:'', description:'', shelf:'', price:'free', amount:'', rdept:ME.dept, envs:[], refs:[], files:[], review:false });

});
function persistPublished(){ store.set('published', ITEMS.filter(i => /^u-/.test(i.id))); }
function refreshPreview(){ const p = document.getElementById('p-prev'); if (p) p.innerHTML = pubPreview(); }
function rerenderPublish(){ const y = window.scrollY; const a = document.activeElement && document.activeElement.id; document.getElementById('page').innerHTML = pagePublish(); observe(); window.scrollTo(0, y); if (a) { const el = document.getElementById(a); if (el) el.focus(); } }
function decide(id, status){
  const it = byId(id); const note = (document.getElementById('rv-note') || {}).value || '';
  if (status === 'returned' && !note.trim()) return;
  it.review = { status:status, by:'審査担当者', at:isoToday(), note:note.trim() }; if (status === 'approved') it.tier = 'official';

document.addEventListener('focusout', e => { if (e.target.id === 'sq') setTimeout(() => { const l = document.getElementById('sq-list'); if (l && !l.matches(':hover')) l.hidden = true; }, 150); });
// 最初の履歴にも hash を持たせる（戻るで最初の項目に戻ったとき、画面が hash と合うように）
if (!location.hash || location.hash === '#' || location.hash === '#/') history.replaceState(null, '', '#/' + (ss.get('store.route') || 'home'));
render();
})();
